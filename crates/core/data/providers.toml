# Providers recognized from DNS, mail, network and HTTP evidence.
#
# Only unambiguous markers belong here: a wrong name in a report is worse than
# showing the raw value (the NS, the MX, the AS name), which the report does
# whenever nothing matches.
#
# Name patterns match the end of a host name on a label boundary
# ("cloudflare.com" matches "ns1.cloudflare.com", not "notcloudflare.com").
# A pattern starting with "~" matches anywhere ("~awsdns-").

[[dns]]
name = "Cloudflare"
ns = ["ns.cloudflare.com"]

[[dns]]
name = "Amazon Route 53"
ns = ["~awsdns-"]

[[dns]]
name = "Google Cloud DNS"
ns = ["googledomains.com"]

