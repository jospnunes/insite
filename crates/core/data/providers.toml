# A CDN or edge proxy is reported when any of its markers is present.
# headers: a response header that exists; server: substring of `Server`;
# cname: suffix of a CNAME target; asn: the final peer's AS.

[[cdn]]
name = "Cloudflare"
headers = ["cf-ray"]
server = ["cloudflare"]
cname = ["cdn.cloudflare.net"]
asn = [13335]

[[cdn]]
name = "Akamai"
headers = ["akamai-grn", "x-akamai-transformed"]
server = ["akamaighost", "akamainetstorage"]
cname = ["edgekey.net", "akamaiedge.net", "edgesuite.net", "akamaized.net"]
asn = [20940, 16625]

[[cdn]]
name = "Fastly"
headers = ["x-fastly-request-id", "fastly-debug-digest"]
cname = ["fastly.net", "fastlylb.net"]
asn = [54113]

[[cdn]]
name = "Amazon CloudFront"
headers = ["x-amz-cf-id", "x-amz-cf-pop"]
cname = ["cloudfront.net"]

[[cdn]]
name = "Azure Front Door"
headers = ["x-azure-ref"]
cname = ["azurefd.net", "azureedge.net"]

[[cdn]]
name = "Vercel"
headers = ["x-vercel-id"]
server = ["vercel"]

[[cdn]]
name = "Netlify"
headers = ["x-nf-request-id"]
server = ["netlify"]

[[cdn]]
name = "Bunny CDN"
server = ["bunnycdn"]
cname = ["b-cdn.net"]

[[cdn]]
name = "KeyCDN"
server = ["keycdn-engine"]

[[cdn]]
name = "Sucuri"
headers = ["x-sucuri-id"]
server = ["sucuri"]

[[cdn]]
name = "Imperva"
headers = ["x-iinfo"]
cname = ["incapdns.net", "impervadns.net"]

# A challenge or block page replaces the content. Each signal is a set of
# conditions that must all hold: status (any of), header (present, and
# containing value when given), body (substring of the first 64 KB).

[[challenge]]
name = "Cloudflare"
signals = [
  { header = "cf-mitigated", value = "challenge" },
  { status = [403, 503], header = "server", value = "cloudflare", body = "/cdn-cgi/challenge-platform/" },
]

[[challenge]]
name = "Vercel"
signals = [{ header = "x-vercel-mitigated", value = "challenge" }]

[[challenge]]
name = "AWS WAF"
signals = [
  { header = "x-amzn-waf-action", value = "challenge" },
  { header = "x-amzn-waf-action", value = "captcha" },
]

[[challenge]]
name = "Akamai"
signals = [{ status = [403], header = "server", value = "akamaighost", body = "Reference&#32;&#35;" }]

[[challenge]]
name = "Imperva"
signals = [{ body = "_Incapsula_Resource" }]

[[challenge]]
name = "Sucuri"
signals = [{ status = [403], body = "Sucuri WebSite Firewall" }]

[[challenge]]
name = "DataDome"
signals = [{ status = [403], header = "x-datadome", body = "captcha-delivery.com" }]
