[package]
name = "insite-core"
description = "Collection and analysis engine behind the insite CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = ["src/**", "data/**", "findings/**", "build.rs", "Cargo.toml"]

[dependencies]
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
rustls-native-certs.workspace = true
hickory-resolver.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
url.workspace = true
idna.workspace = true
flate2.workspace = true
lol_html.workspace = true
encoding_rs.workspace = true
brotli-decompressor.workspace = true
serde.workspace = true
serde_json.workspace = true
x509-parser.workspace = true
psl.workspace = true
toml.workspace = true

insite-sigc.workspace = true
regex.workspace = true
aho-corasick.workspace = true
fancy-regex.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
insite-sigc.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "server", "server-auto"] }
rcgen = "0.14"
brotli = "8"
