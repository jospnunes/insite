name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HAS_FIXTURES_KEY: ${{ secrets.INSITE_FIXTURES_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The hand-labeled snapshots hold third-party pages, so they live in a
      # private repository; without its key (pull requests from forks) the
      # precision test passes without running.
      - name: Check out the fixtures
        if: runner.os == 'Linux' && env.HAS_FIXTURES_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: jospnunes/insite-fixtures
          ssh-key: ${{ secrets.INSITE_FIXTURES_KEY }}
          path: fixtures
      - name: Point the tests to the fixtures
        if: runner.os == 'Linux' && env.HAS_FIXTURES_KEY == 'true'
        run: echo "INSITE_FIXTURES=$GITHUB_WORKSPACE/fixtures" >> "$GITHUB_ENV"
      # The browser tests run where a Chrome is preinstalled (the Linux and
      # macOS images); elsewhere they pass without running.
      - name: Find Chrome
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for c in google-chrome chromium "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"; do
            if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then
              echo "CHROME_PATH=$(command -v "$c" || echo "$c")" >> "$GITHUB_ENV"; break
            fi
          done
      # A first start on a fresh runner reads the browser from a cold disk and
      # has been seen to take over 30 s; the log shows how long it took, and
      # the tests then start a warm browser.
      - name: Warm up Chrome
        if: env.CHROME_PATH != ''
        shell: bash
        run: |
          profile=$(mktemp -d)
          time "$CHROME_PATH" --headless --no-first-run --user-data-dir="$profile" --dump-dom about:blank > /dev/null
          rm -rf "$profile"
      - run: cargo test --all-targets

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
