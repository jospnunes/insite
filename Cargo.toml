[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/sigc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/jospnunes/insite"
homepage = "https://github.com/jospnunes/insite"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config", "recursor"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
url = "2"
idna = "1"
flate2 = "1"
libc = "0.2"
lol_html = "3"
encoding_rs = "0.8"
brotli-decompressor = "6"
x509-parser = { version = "0.18", features = ["verify"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
regex-syntax = "0.8"
aho-corasick = "1"
fancy-regex = "0.20"
psl = "2"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
clap = { version = "4", features = ["derive"] }
insite-core = { path = "crates/core", version = "0.1.0" }
insite-sigc = { path = "crates/sigc", version = "0.1.0" }

# The build script compiles 15,000 signature patterns; optimize it in dev builds.
[profile.dev.build-override]
opt-level = 3

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
